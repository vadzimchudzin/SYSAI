# Render Blueprint: Dashboard -> New -> Blueprint -> выберите этот репозиторий.
services:
  - type: web
    name: sysai
    runtime: docker
    # free засыпает через 15 минут без запросов; starter (7 $/мес) не засыпает. Что выбрать: deploy/HOSTING.md
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ADMIN_USERNAME
        value: SYSAI
      - key: ADMIN_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_MODE
        value: webhook
      - key: TIMEZONE
        value: Europe/Minsk
      - key: DATABASE_URL
        sync: false
      # Recordings storage (see README, «Хранилище записей»): without these four the recordings are not kept.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
