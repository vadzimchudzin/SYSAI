# SYSAI на своём сервере: Postgres, приложение, Caddy (HTTPS) и ночной бэкап.
# Запуск (из этой папки): cp .env.example .env, заполнить .env, затем docker compose up -d --build
# Порт 8000 наружу не публикуется: снаружи доступен только Caddy (80 и 443).
name: sysai

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: sysai
      POSTGRES_USER: sysai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysai -d sysai"]
      interval: 5s
      timeout: 5s
      retries: 12

  sysai:
    build:
      context: ..
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sysai:${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в файле .env}@db:5432/sysai
      DATA_DIR: /srv/data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/srv/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Аккаунт Telegram отпускается при остановке: даём приложению время закрыться чисто.
    stop_grace_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - sysai
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Задайте SITE_ADDRESS в файле .env (IP сервера или домен)}
      TLS_ARG: ${TLS_ARG:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Раз в сутки дамп базы в ./backups, старше BACKUP_KEEP_DAYS дней удаляется. Первый дамп сразу после запуска.
  backup:
    image: postgres:17-bookworm
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        while true; do
          file="/backups/sysai_$$(date +%Y-%m-%d_%H%M).dump"
          if pg_dump -h db -U sysai -d sysai -Fc -f "$$file.tmp"; then
            mv "$$file.tmp" "$$file"
            echo "backup ok: $$file"
          else
            rm -f "$$file.tmp"
            echo "backup FAILED"
          fi
          find /backups -name 'sysai_*.dump' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
