{% extends "base.html" %}{% block title %}Прогресс — SYSAI{% endblock %}
{% block body %}
<div class="row between pg-head">
  <h1>Прогресс</h1>
  <form method="get" action="/progress" class="row pg-scope">
    <select name="scope" onchange="this.form.submit()">
      <option value="last" {{ 'selected' if data.scope == 'last' }}>Последнее совещание</option>
      <option value="open" {{ 'selected' if data.scope == 'open' }}>Все открытые дела</option>
      <option value="week" {{ 'selected' if data.scope == 'week' }}>За 7 дней</option>
      <option value="chat" {{ 'selected' if data.scope == 'chat' }}>Поручения из чата</option>
      {% for m in data.meetings %}<option value="{{ m.id }}" {{ 'selected' if data.scope == m.id|string }}>{{ m.date }} · {{ m.title }}</option>{% endfor %}
    </select>
    <noscript><button class="btn sm">Показать</button></noscript>
  </form>
</div>
<div id="progress-feed" data-scope="{{ data.scope }}" data-version="{{ data.version }}">
{% include "_progress_feed.html" %}
</div>
<p class="muted small" id="progress-live">Обновляется само, без перезагрузки страницы.</p>
<script src="{{ asset('progress.js') }}" defer></script>
{% endblock %}
