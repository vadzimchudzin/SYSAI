name: execution-pilot
on:
  push:
    branches: [EXperemental-AI]
  pull_request:
    branches: [experimental]
permissions:
  contents: read
concurrency:
  group: execution-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYSAI_TESTING: "1"
      OPENROUTER_API_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt && python -m pip check
      - name: Full regression and NEW execution code LINE coverage gate
        run: >-
          python -m pytest -q --cov=app.coordinator --cov=examples.sysai_mcp_client
          --cov-fail-under=80 --cov-report=term-missing
          --cov-report=xml:coverage-line.xml --cov-report=json:coverage-line.json
          --junitxml=pytest-results.xml
      - name: Separate NEW execution code BRANCH report (not whole-repo coverage)
        env:
          COVERAGE_FILE: .coverage.branch
        run: >-
          python -m pytest -q tests/test_coordinator.py tests/test_execution_mcp.py tests/test_execution_proxy.py
          --cov=app.coordinator --cov=examples.sysai_mcp_client --cov-branch
          --cov-report=term-missing --cov-report=xml:coverage-branch.xml --cov-report=json:coverage-branch.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: execution-pilot-test-and-coverage-results
          path: |
            pytest-results.xml
            coverage-line.xml
            coverage-line.json
            coverage-branch.xml
            coverage-branch.json
